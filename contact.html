<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="modal-content">
        <h2>System Administration Contact</h2>
        <p>If you encounter any critical errors, please notify the platform administrator.</p>
        <form>
            <label for="message">Message:</label><br>
            <textarea id="message" rows="4" cols="40" placeholder="Describe the system issue..."></textarea><br><br>
            <button type="submit">Submit Ticket</button>
        </form>
    </div>
</body>
</html>
